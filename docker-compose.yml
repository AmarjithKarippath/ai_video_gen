version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8005:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
    environment:
      - DATABASE_URL=sqlite:///./customers.db
    networks:
      - app-network

  frontend:
    build: ./frontend
    ports:
      - "3006:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8005
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
